backend:
  name: git-gateway
  repo: vlok-production/aeontraveltours
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

collections:
  - name: "packages_data"
    label: "Tour Packages"
    label_singular: "Tour Package"
    delete: false
    editor:
      preview: true
    files:
      - label: "Packages"
        name: "packages"
        file: "content/data/packages.json"
        format: "json"
        description: "Manage the tour packages that appear on the Trips page and package detail pages."
        fields:
          - label: "Packages"
            name: "packages"
            widget: "list"
            label_singular: "Package"
            summary: "{{fields.title}} | {{fields.destination}} | {{fields.duration_days}} days | ${{fields.price_from}}"
            collapsed: true
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "Main package title shown on cards and detail pages."
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false
                hint: "Short supporting line under the title."
              - label: "Slug"
                name: "slug"
                widget: "string"
                hint: "Used in the URL, for example: 10-Days-Sri-Lanka-Dream-Route"
                pattern:
                  - "^[A-Za-z0-9-]+$"
                  - "Use letters, numbers, and hyphens only."
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Cultural Expedition"
                  - "Island Explorer"
                  - "Luxury Circuit"
                  - "Romantic Escape"
                  - "Quick Getaway"
                  - "Honeymoon Escape"
                  - "Family Adventure"
                hint: "Shown as the package type badge."
              - label: "Destination"
                name: "destination"
                widget: "select"
                options:
                  - "Cultural Triangle"
                  - "Southern Coast"
                  - "Central Highlands"
                  - "Wild Frontier"
                  - "Colonial Heritage"
                  - "Authentic Local"
                hint: "Used in filters and package grouping."
              - label: "Activity Type"
                name: "activity_type"
                widget: "select"
                options:
                  - "Cultural Heritage"
                  - "Surfing & Coastal"
                  - "Wildlife Safari"
                hint: "Used in the tours filter."
              - label: "Budget Range"
                name: "budget_range"
                widget: "select"
                options:
                  - "Budget Friendly"
                  - "Mid-Range"
                  - "Luxury Experience"
              - label: "Duration Days"
                name: "duration_days"
                widget: "number"
                value_type: "int"
                min: 1
              - label: "Group Size"
                name: "group_size"
                widget: "string"
                hint: "Example: Tailor Made"
              - label: "Travelers Label"
                name: "travelers_label"
                widget: "string"
                hint: "Example: Family, Couple & Friends"
              - label: "Price From"
                name: "price_from"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "Base selling price shown on cards."
              - label: "Price Original"
                name: "price_original"
                widget: "number"
                value_type: "int"
                required: false
                min: 0
                hint: "Optional struck-through price."
              - label: "Rating"
                name: "rating"
                widget: "number"
                value_type: "float"
                min: 0
                max: 5
                step: 0.1
              - label: "Card Image"
                name: "card_image"
                widget: "image"
                hint: "Used in cards and CMS preview."
              - label: "Card Alt"
                name: "card_alt"
                widget: "string"
              - label: "Hero Image"
                name: "hero_image"
                widget: "image"
                hint: "Used on the package detail page hero area."
              - label: "Hero Alt"
                name: "hero_alt"
                widget: "string"
              - label: "Card Description"
                name: "card_description"
                widget: "text"
                hint: "Short summary shown in the package card."
              - label: "Overview"
                name: "overview"
                widget: "text"
                hint: "Main descriptive paragraph for the detail page."

              - label: "Highlights"
                name: "highlights"
                widget: "list"
                label_singular: "Highlight"
                collapsed: true
                summary: "{{fields.title}}"
                hint: "Top selling points or major stops in the journey."
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "string"
                    hint: "Material Symbols icon name."
                  - label: "Title"
                    name: "title"
                    widget: "string"
                  - label: "Description"
                    name: "description"
                    widget: "text"

              - label: "Itinerary"
                name: "itinerary"
                widget: "list"
                label_singular: "Day / Stop"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - label: "Title"
                    name: "title"
                    widget: "string"
                    hint: "Example: Day 01: Negombo Arrival"
                  - label: "Description"
                    name: "description"
                    widget: "text"
                  - label: "Details"
                    name: "details"
                    widget: "list"
                    collapsed: true
                    field:
                      label: "Detail"
                      name: "detail"
                      widget: "string"

              - label: "Includes"
                name: "includes"
                widget: "list"
                collapsed: true
                field:
                  label: "Include"
                  name: "include"
                  widget: "string"

              - label: "Excludes"
                name: "excludes"
                widget: "list"
                collapsed: true
                field:
                  label: "Exclude"
                  name: "exclude"
                  widget: "string"

              - label: "Gallery"
                name: "gallery"
                widget: "list"
                label_singular: "Gallery Image"
                collapsed: true
                summary: "{{fields.alt}}"
                fields:
                  - label: "Image"
                    name: "src"
                    widget: "image"
                  - label: "Alt"
                    name: "alt"
                    widget: "string"

              - label: "Related Packages"
                name: "related_slugs"
                widget: "list"
                collapsed: true
                hint: "Add the slugs of other relevant packages."
                field:
                  label: "Related Slug"
                  name: "slug"
                  widget: "string"

              - label: "Source URL"
                name: "source_url"
                widget: "string"
                required: false
                hint: "Optional reference link used internally."
